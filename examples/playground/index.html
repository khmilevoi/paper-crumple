<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paper-crumple playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="masthead">
      <h1>paper-crumple playground</h1>
      <p id="version-line">booting…</p>
    </header>
    <main>
      <aside id="config-column">
        <h2>Factory options</h2>
        <div id="config"></div>
        <section id="share">
          <h2>Share</h2>
          <p class="config-note">
            The URL hash always mirrors the live config and every knob that differs from its default
            — copy the address bar to share this exact picture.
          </p>
          <button type="button" id="copy-code-btn">Copy as code</button>
          <pre id="emitted-code"></pre>
        </section>
      </aside>
      <section id="stage-column">
        <div id="hero-slot"></div>
        <div id="transport"></div>
        <div id="grid"></div>
      </section>
      <aside id="panel-column">
        <h2>Knobs</h2>
        <div id="knob-count"></div>
        <div id="panel"></div>
      </aside>
    </main>
    <section id="inspector"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
